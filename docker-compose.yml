services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.dev
    container_name: family_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - family_network
    depends_on:
      - mongodb

  nginx:
    image: nginx:alpine
    container_name: family_nginx
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - family_network
    depends_on:
      - app

  mongodb:
    image: mongo:8.0
    container_name: family_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: family_hub
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    volumes:
      - mongodb_data:/data/db
      - ./docker/scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    ports:
      - "27030:27017"
    networks:
      - family_network

  vite:
    image: node:22-alpine
    container_name: family_vite
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5180:5180"
    environment:
      VITE_HMR_HOST: ${VITE_HMR_HOST:-}
    command: npm run dev -- --host --port 5180
    networks:
      - family_network

networks:
  family_network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
